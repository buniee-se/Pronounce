<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dayleaf — Daily Learning &amp; Activity Journal</title>
    <meta
      name="description"
      content="A cozy, minimalist personal learning journal to log daily study sessions, save clickable resources, track takeaways, and keep your study streak alive."
    />
    <meta property="og:title" content="Dayleaf — Daily Learning & Activity Journal" />
    <meta
      property="og:description"
      content="A cozy, minimalist personal learning journal to log daily study sessions, save clickable resources, track takeaways, and keep your study streak alive."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dayleaf_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F4] text-[#22201C] dark:bg-[#141311] dark:text-[#EFECE6] antialiased selection:bg-[#3D6B52]/20 dark:selection:bg-[#7EB093]/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
